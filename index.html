<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Small, self-contained tools for the browser.">
    <link rel="icon" href="data:,">
    <title>Tools</title>
    <style>
      :root {
        --text: #111;
        --muted: #666;
        --line: #e8e8e8;
        --link: #1a5fa8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        color: var(--text);
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
        min-height: 100vh;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 3px;
      }

      .wrapper {
        margin: 0 auto;
        max-width: 800px;
        padding: 0 30px;
      }

      .site-header {
        background-color: #fdfdfd;
        border-top: 5px solid #424242;
        border-bottom: 1px solid var(--line);
        box-sizing: content-box;
        min-height: 55.95px;
        position: relative;
      }

      .site-header .wrapper {
        display: flow-root;
      }

      .site-title {
        color: #424242;
        font-size: 26px;
        font-weight: 300;
        line-height: 54px;
        letter-spacing: -1px;
        margin-bottom: 0;
        float: left;
      }

      .site-title:hover {
        color: #424242;
      }

      .site-nav {
        float: right;
        line-height: 54px;
      }

      .nav-trigger,
      .menu-icon {
        display: none;
      }

      .sr-only {
        clip: rect(0 0 0 0);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      .page-link {
        color: #111;
        line-height: 1.5;
      }

      .page-link:not(:last-child) {
        margin-right: 20px;
      }

      .page-content {
        flex: 1;
        min-height: 420px;
        padding: 30px 0;
      }

      h1,
      h2 {
        color: #111;
        font-weight: 400;
        line-height: 1.5;
      }

      h1 {
        font-size: 28px;
        margin: 0 0 15px;
      }

      h2 {
        font-size: 24px;
        margin: 30px 0 15px;
      }

      p {
        margin: 0 0 15px;
      }

      .empty-state {
        color: var(--muted);
      }

      .site-footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
        padding: 24px 0;
      }

      .site-footer p:last-child {
        margin-bottom: 0;
      }

      @media (max-width: 600px) {
        .wrapper {
          padding: 0 15px;
        }

        .site-nav {
          background-color: #fdfdfd;
          border: 1px solid var(--line);
          border-radius: 5px;
          line-height: normal;
          position: absolute;
          right: 15px;
          text-align: right;
          top: 9px;
        }

        .nav-trigger {
          clip: rect(0 0 0 0);
          display: block;
          height: 1px;
          overflow: hidden;
          position: absolute;
          white-space: nowrap;
          width: 1px;
        }

        .site-nav label[for="nav-trigger"] {
          cursor: pointer;
          display: block;
          float: right;
          height: 36px;
          width: 36px;
          z-index: 2;
        }

        .nav-trigger:focus-visible + label {
          outline: 2px solid var(--link);
          outline-offset: 3px;
        }

        .menu-icon {
          display: block;
          float: right;
          height: 26px;
          line-height: 0;
          padding-top: 10px;
          text-align: center;
          width: 36px;
        }

        .menu-icon > svg {
          fill: #424242;
        }

        .nav-trigger ~ .trigger {
          clear: both;
          display: none;
        }

        .nav-trigger:checked ~ .trigger {
          display: block;
          padding-bottom: 5px;
        }

        .page-link {
          display: block;
          margin-left: 20px;
          padding: 5px 10px;
        }

        .page-link:not(:last-child) {
          margin-right: 0;
        }

        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="index.html">Jeonguk Choi’s Tools</a>
        <nav class="site-nav" aria-label="Project links">
          <input class="nav-trigger" id="nav-trigger" type="checkbox">
          <label for="nav-trigger">
            <span class="menu-icon">
              <svg viewBox="0 0 18 15" width="18" height="15" aria-hidden="true">
                <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
              </svg>
            </span>
            <span class="sr-only">Toggle navigation</span>
          </label>
          <div class="trigger">
            <a class="page-link" href="https://cjeong.uk">Blog</a>
            <a class="page-link" href="https://github.com/cjeonguk/tools">GitHub</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <div class="wrapper">
        <h1>Tools</h1>
        <p>A collection of small, self-contained tools that run in the browser.</p>

        <section aria-labelledby="catalog-title">
          <h2 id="catalog-title">Tool catalog</h2>
          <div id="tool-catalog">
            <p class="empty-state">No tools have been added yet.</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p><a href="LICENSE">MIT License</a> · Inspired by <a href="https://simonwillison.net/2025/Dec/10/html-tools/">Useful patterns for building HTML tools</a></p>
      </div>
    </footer>
  </body>
</html>
