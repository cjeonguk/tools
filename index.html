<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Small, self-contained tools for the browser.">
    <link rel="icon" href="data:,">
    <title>Tools</title>
    <style>
      /* Design follows https://cjeong.uk (minima 2.5.1 with the auto dark skin). */
      :root {
        color-scheme: light dark;

        --text-color: #111;
        --heading-color: #111;
        --background-color: #fdfdfd;
        --brand-color: #2a7ae2;
        --brand-color-visited: #1756a9;
        --link-hover-color: #111;

        --site-title-color: #424242;
        --grey-color: #828282;
        --grey-color-light: #e8e8e8;
        --grey-color-dark: #424242;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text-color: #959595;
          --heading-color: #bbbbbb;
          --background-color: #181818;
          --brand-color: #5691cd;
          --brand-color-visited: #80bbff;
          --link-hover-color: #959595;

          --site-title-color: #a6a6a6;
          --grey-color: #858585;
          --grey-color-light: #2b2b2b;
          --grey-color-dark: #999999;
        }
      }

      body, h1, h2, p, ul {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--background-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        font-feature-settings: "kern" 1;
        font-kerning: normal;
        min-height: 100vh;
        -webkit-text-size-adjust: 100%;
      }

      h1, h2, p, ul {
        margin-bottom: 15px;
      }

      h1, h2 {
        color: var(--heading-color);
        font-weight: 400;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 24px;
        margin-top: 30px;
      }

      a {
        color: var(--brand-color);
        text-decoration: none;
      }

      a:visited {
        color: var(--brand-color-visited);
      }

      a:hover {
        color: var(--link-hover-color);
        text-decoration: underline;
      }

      a:focus-visible {
        outline: 2px solid var(--brand-color);
        outline-offset: 3px;
      }

      .wrapper {
        margin-left: auto;
        margin-right: auto;
        max-width: calc(800px - (30px * 2));
        padding-left: 30px;
        padding-right: 30px;
      }

      .wrapper::after {
        clear: both;
        content: "";
        display: table;
      }

      /* Site header */
      .site-header {
        border-bottom: 1px solid var(--grey-color-light);
        border-top: 5px solid var(--grey-color-dark);
        min-height: 55.95px;
        position: relative;
      }

      .site-title {
        float: left;
        font-size: 26px;
        font-weight: 300;
        letter-spacing: -1px;
        line-height: 54px;
        margin-bottom: 0;
      }

      .site-title,
      .site-title:visited {
        color: var(--site-title-color);
      }

      .site-nav {
        float: right;
        line-height: 54px;
      }

      .site-nav .nav-trigger,
      .site-nav .menu-icon {
        display: none;
      }

      .site-nav .page-link {
        color: var(--text-color);
        line-height: 1.5;
      }

      .site-nav .page-link:not(:last-child) {
        margin-right: 20px;
      }

      /* Site footer */
      .site-footer {
        border-top: 1px solid var(--grey-color-light);
        color: var(--grey-color);
        font-size: 14px;
        padding: 24px 0;
      }

      .site-footer p:last-child {
        margin-bottom: 0;
      }

      /* Page content */
      .page-content {
        flex: 1;
        padding: 30px 0;
      }

      .empty-state {
        color: var(--grey-color);
      }

      @media screen and (max-width: 800px) {
        .wrapper {
          max-width: calc(800px - 30px);
          padding-left: 15px;
          padding-right: 15px;
        }
      }

      /* Mobile: the menu button opens a full-screen overlay below the header. */
      @media screen and (max-width: 600px) {
        .site-nav {
          line-height: normal;
        }

        .site-nav .nav-trigger {
          display: block;
          height: 1px;
          opacity: 0;
          pointer-events: none;
          position: absolute;
          width: 1px;
        }

        .site-nav label[for="nav-trigger"] {
          border-radius: 3px;
          cursor: pointer;
          display: block;
          height: 36px;
          margin-right: -9px;
          margin-top: calc((55.95px - 36px) / 2);
          width: 36px;
        }

        .site-nav .nav-trigger:focus-visible ~ label[for="nav-trigger"] {
          outline: 2px solid var(--brand-color);
        }

        .site-nav .menu-icon {
          align-items: center;
          display: flex;
          height: 100%;
          justify-content: center;
          width: 100%;
        }

        .site-nav .menu-icon > svg {
          fill: var(--grey-color-dark);
        }

        .site-nav .menu-icon .icon-close {
          display: none;
          stroke: var(--grey-color-dark);
        }

        .site-nav .nav-trigger:checked ~ label .icon-open {
          display: none;
        }

        .site-nav .nav-trigger:checked ~ label .icon-close {
          display: block;
        }

        .site-nav .trigger {
          background-color: var(--background-color);
          display: none;
          height: 100vh;
          left: 0;
          padding: 10px 15px;
          position: absolute;
          right: 0;
          top: calc(100% + 1px);
          z-index: 10;
        }

        .site-nav .nav-trigger:checked ~ .trigger {
          display: block;
        }

        .site-nav .page-link {
          display: block;
          font-size: 20px;
          padding: 10px 0;
        }

        .site-nav .page-link:not(:last-child) {
          margin-right: 0;
        }

        body:has(.nav-trigger:checked) {
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" rel="author" href="index.html">Jeonguk Choi’s Tools</a>

        <nav class="site-nav" aria-label="Site">
          <input type="checkbox" id="nav-trigger" class="nav-trigger">
          <label for="nav-trigger" aria-label="Menu">
            <span class="menu-icon">
              <svg class="icon-close" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path d="M2 2l12 12M14 2L2 14" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <svg class="icon-open" viewBox="0 0 18 15" width="18" height="15" aria-hidden="true">
                <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
              </svg>
            </span>
          </label>

          <div class="trigger">
            <a class="page-link" href="https://cjeong.uk">Blog</a>
            <a class="page-link" href="https://github.com/cjeonguk/tools" target="_blank" rel="noopener noreferrer">GitHub</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        <h1>Tools</h1>
        <p>A collection of small, self-contained tools that run in the browser.</p>

        <section aria-labelledby="catalog-title">
          <h2 id="catalog-title">Tool catalog</h2>
          <div id="tool-catalog">
            <p class="empty-state">No tools have been added yet.</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p><a href="LICENSE.txt">MIT License</a> · Inspired by <a href="https://simonwillison.net/2025/Dec/10/html-tools/">Useful patterns for building HTML tools</a></p>
      </div>
    </footer>

    <script>
      // Close the mobile menu with Escape.
      document.addEventListener("keydown", (event) => {
        const trigger = document.getElementById("nav-trigger");
        if (event.key === "Escape" && trigger.checked) {
          trigger.checked = false;
          trigger.focus();
        }
      });
    </script>
  </body>
</html>
