<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Small, self-contained tools for the browser.">
    <link rel="icon" href="data:,">
    <title>Tools</title>
    <style>
      :root {
        --text: #111;
        --muted: #666;
        --line: #e8e8e8;
        --link: #1a5fa8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 3px;
      }

      .wrapper {
        margin: 0 auto;
        max-width: 800px;
        padding: 0 30px;
      }

      .site-header {
        border-top: 5px solid #424242;
        border-bottom: 1px solid var(--line);
        min-height: 56px;
      }

      .site-header .wrapper {
        align-items: center;
        display: flex;
        justify-content: space-between;
        min-height: 54px;
      }

      .site-title {
        color: #424242;
        font-size: 26px;
        font-weight: 300;
        letter-spacing: -1px;
      }

      .site-title:hover {
        color: #424242;
      }

      .site-nav {
        display: flex;
        gap: 20px;
      }

      .site-nav a {
        color: #111;
      }

      .page-content {
        min-height: 420px;
        padding: 30px 0;
      }

      h1,
      h2 {
        color: #111;
        font-weight: 400;
        letter-spacing: -1px;
      }

      h1 {
        font-size: 28px;
        line-height: 1;
        margin: 0 0 20px;
      }

      h2 {
        font-size: 24px;
        line-height: 1.1;
        margin: 30px 0 15px;
      }

      p {
        margin: 0 0 15px;
      }

      .empty-state {
        color: var(--muted);
      }

      .site-footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
        padding: 24px 0;
      }

      .site-footer p:last-child {
        margin-bottom: 0;
      }

      @media (max-width: 600px) {
        .wrapper {
          padding: 0 15px;
        }

        .site-title {
          font-size: 22px;
        }

        .site-nav {
          gap: 14px;
        }

        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="index.html">Jeonguk Choi's Tools</a>
        <nav class="site-nav" aria-label="Project links">
          <a href="https://cjeong.uk">Blog</a>
          <a href="https://github.com/cjeonguk/tools">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <div class="wrapper">
        <h1>Tools</h1>
        <p>A collection of small, self-contained tools that run in the browser.</p>

        <section aria-labelledby="catalog-title">
          <h2 id="catalog-title">Tool catalog</h2>
          <div id="tool-catalog">
            <p class="empty-state">No tools have been added yet.</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p><a href="LICENSE">MIT License</a> · Inspired by <a href="https://simonwillison.net/2025/Dec/10/html-tools/">Useful patterns for building HTML tools</a></p>
      </div>
    </footer>
  </body>
</html>
